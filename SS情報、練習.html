<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>詳細スケジュール管理</title>
    <link rel="stylesheet" href="style.css"> </head>
<body>
    <div class="overlay" id="overlay" onclick="closeModals()"></div>

    <div class="calendar-container card">
        <h2 id="month-display">カレンダー</h2>
        <div class="calendar-grid" id="calendar-grid"></div>
    </div>

    <div class="side-panel">
        <div class="card input-card">
            <h2 id="selected-date-label">日付を選択</h2>
            <div class="time-inputs">
                <div><span class="label">開始</span><input type="time" id="start-time" value="09:00"></div>
                <div><span class="label">終了</span><input type="time" id="end-time" value="10:00"></div>
            </div>
            <span class="label">予定の内容</span>
           <span class="label">重要度</span>
<select id="priority-input">
    <option value="normal">ふつう</option>
    <option value="high">重要（赤）</option>
    <option value="low">後回し（青）</option>
</select>
            <input type="text" id="todo-input" placeholder="例：プログラミング">
            <button class="btn-main" onclick="addTodo()">この日だけ保存</button>
            <button class="btn-bulk" onclick="openBulkModal()">✨ 複数日に一括登録</button>
        </div>

        <div class="card list-card">
            <h2>本日のタイムライン</h2>
            <div id="todo-list"></div>
        </div>
    </div>

    <div id="bulk-modal" class="modal">
        <h3>繰り返し設定</h3>
        <div class="day-checkboxes">
            <label><input type="checkbox" value="1">月</label><label><input type="checkbox" value="2">火</label>
            <label><input type="checkbox" value="3">水</label><label><input type="checkbox" value="4">木</label>
            <label><input type="checkbox" value="5">金</label><label><input type="checkbox" value="6">土</label>
            <label><input type="checkbox" value="0">日</label>
        </div>
        <button class="btn-bulk" onclick="executeBulkAdd()">一括登録実行</button>
        <button class="btn-cancel" onclick="closeModals()">キャンセル</button>
    </div>

    <script src="script.js"></script> </body>
</html>
