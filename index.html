<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SS情報班 予定管理ダッシュボード</title>
  <link rel="manifest" href="manifest.json">
  <!-- 円グラフ描画用ライブラリ（Chart.js） -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- CSSファイルの読み込み -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>SS情報班 予定管理ダッシュボード</header>

  <div class="dashboard-container">
    
    <!-- ================= 左パネル（入力フォーム ＆ カレンダー） ================= -->
    <div class="left-panel">
      
      <!-- 予定追加フォーム -->
      <div class="card">
        <h3 class="card-title">📝 新しい予定を追加</h3>
        <div class="form-group">
          <label>予定のタイトル</label>
          <input type="text" id="taskTitle" placeholder="例: レポート提出">
        </div>
<div class="form-row">
          <div class="form-group">
            <label>開始日時</label>
            <input type="datetime-local" id="taskDatetime">
          </div>
          <div class="form-group">
            <label>終了日時</label>
            <input type="datetime-local" id="taskEndDatetime">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>重要度</label>
            <select id="taskPriority">
              <option value="high">高 (赤)</option>
              <option value="medium" selected>中 (黄)</option>
              <option value="low">低 (緑)</option>
            </select>
          </div>
          <div class="form-group">
            <label>フォルダ</label>
            <select id="taskCategory">
              <option value="work">仕事</option>
              <option value="house">家事</option>
              <option value="hobby">趣味</option>
              <option value="study">勉強</option>
              <option value="other">その他</option>
            </select>
          </div>
        </div>
        <button class="btn-primary" onclick="addTask()">予定を追加する</button>
      </div>

      <!-- カレンダー -->
      <div class="card">
        <div class="cal-header-ctrl">
          <button onclick="changeMonth(-1)">◀ 前月</button>
          <h3 id="calMonthTitle" class="cal-title"></h3>
          <button onclick="changeMonth(1)">次月 ▶</button>
        </div>
        <div class="calendar-header">
          <span class="sun">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span class="sat">土</span>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
        
        <!-- カレンダー日付選択時のフィルター解除表示 -->
        <div id="calendarFilterStatus" class="filter-status" style="display: none;">
          <span id="filterDateText"></span>
          <button class="btn-clear-filter" onclick="clearDateFilter()">すべての予定を表示</button>
        </div>
      </div>

    </div>

    <!-- ================= 右パネル（円グラフ ＆ 予定リスト） ================= -->
    <div class="right-panel">
      
      <!-- 円グラフ（カテゴリ別内訳） -->
      <div class="card">
        <h3 class="card-title" id="chartTitleText">📊 24時間スケジュール（今日）</h3>
        <div class="chart-container">
          <canvas id="categoryChart"></canvas>
        </div>
      </div>

      <!-- 予定リスト（表示方式変更機能付き） -->
      <div class="card">
        <div class="list-header-ctrl">
          <h3 class="card-title" id="listTitleText">📋 予定一覧</h3>
          
          <!-- 表示方式切り替えボタン -->
          <!-- 一括削除ボタン -->
           <button class="mode-btn"  id="DeleteButton" type="button">★の削除</button>
           <button class="mode-btn"  id="ClearButton" type="button">完了済予定の削除</button>

        </div>

        <!-- フォルダ別インデックス -->
        <div class="category-tabs" id="categoryTabs"></div>

        <!-- 予定一覧描画エリア -->
        <div id="taskListContainer" class="view-card"></div>
      </div>

    </div>

  </div>
  <!-- 週別時間割メモ -->
<div class="card timetable-card">
  <h3 class="card-title">📝 週別時間割メモ</h3>

<div class="timetable-selectors">

  <!-- 週選択 -->
  <div id="timetableWeekSelector" class="timetable-weeks"></div>

  <!-- 曜日選択 -->
  <div id="timetableDaySelector" class="timetable-days"></div>

  <!-- 時限選択 -->
  <div id="timetablePeriodSelector" class="timetable-periods"></div>

  <!-- メモ編集（先に表示） -->
  <div class="timetable-editor">
    <h4 id="timetableSlotTitle">A週・月曜日・1時間目</h4>

    <label for="timetableMemo">自由記入メモ</label>

    <textarea
      id="timetableMemo"
      class="timetable-memo"
      rows="5"
      placeholder="ここに自由に記録してください..."
    ></textarea>

    <div id="timetableSaveStatus" class="timetable-save-status">
      自動保存されます
    </div>
  </div>

  <!-- 時間割呼び出し（後に表示） -->
<!-- その週の時間割登録 -->
<div class="weekly-schedule-panel">

  <h4>📅 その週の時間割</h4>

  <p class="weekly-schedule-description">
    曜日ごとに時間割の参照先を登録してください。
    例：A月1 A月2
  </p>

  <div id="weeklyScheduleRows"></div>

  <button
    type="button"
    id="saveWeeklyScheduleButton"
    class="weekly-schedule-save-btn">
    時間割を登録
  </button>

  <div id="weeklyScheduleStatus"></div>

  <div id="weeklyScheduleDisplay"></div>

</div>
  </div>

</div>
</div>

  <!-- JavaScriptの読み込み -->
  <script src="script.js"></script>
</body>
</html>
